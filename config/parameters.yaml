# Optimizer settings read by run_backtest.py

classical:
  maximum_sharpe:
    risk_free_rate: 0.04  # Risk-free rate the optimizer maximizes Sharpe against

quantum_inspired:
  qaoa:
    risk_factor: 0.5  # QAOA_Continuous: 0 = maximize return, 1 = minimize risk
  quantum_annealing:
    num_reads: 100  # HybridAnnealing: number of simulated annealing samples

# Algorithm Parameters Configuration

# Classical Optimization Parameters
classical:
  mean_variance:
    gamma: 0.5  # Risk aversion parameter (0 = min variance, 1 = max return)
    target_return: null  # If set, optimize for this return
    target_volatility: null  # If set, optimize for this volatility

  minimum_variance:
    allow_short: false
    weight_bounds: [0.0, 1.0]

  maximum_sharpe:
    risk_free_rate: 0.04  # 4% annual
    allow_short: false
    weight_bounds: [0.0, 1.0]

  hierarchical_risk_parity:
    linkage_method: "single"  # single, complete, average, ward

  risk_parity:
    risk_measure: "variance"  # variance, cvar, cdar
    risk_free_rate: 0.04

  black_litterman:
    market_cap_weighted: true
    tau: 0.05  # Uncertainty in prior
    pi_method: "market"  # market, equal, custom


# Quantum-Inspired Algorithm Parameters
quantum_inspired:
  qaoa:
    p_layers: 3  # Number of QAOA layers (1-5 typical)
    optimizer: "COBYLA"
    max_iterations: 100
    shots: 1024  # Number of measurements
    backend: "qasm_simulator"  # qasm_simulator, statevector_simulator
    risk_factor: 0.5  # Balance between risk and return (0-1)
    penalty_multiplier: 10.0  # Penalty for constraint violations
    binary_bits: 5  # Bits per asset for weight encoding

  vqe:
    ansatz: "TwoLocal"  # TwoLocal, EfficientSU2, RealAmplitudes
    rotation_blocks: "ry"
    entanglement_blocks: "cx"
    entanglement: "linear"  # linear, full, circular
    reps: 2  # Repetitions of ansatz
    optimizer: "SLSQP"
    max_iterations: 200
    shots: 1024
    risk_factor: 0.5

  quantum_annealing:
    num_reads: 100  # Number of annealing runs
    chain_strength: 2.0
    annealing_time: 20  # microseconds
    auto_scale: true
    solver: "neal"  # neal (simulated), hybrid (cloud), advantage (cloud)
    risk_factor: 0.5

  hybrid:
    quantum_method: "qaoa"  # qaoa, vqe, annealing
    classical_refinement: "mean_variance"
    quantum_iterations: 50
    classical_iterations: 50
    warm_start: true  # Use quantum solution to warm-start classical

  simulated_bifurcation:
    time_steps: 100
    dt: 0.01  # Time step
    pressure: 0.1
    iterations: 1000
    convergence_threshold: 1e-6

# Portfolio Constraints
constraints:
  min_weight: 0.0  # Minimum weight per asset (0 = no short selling)
  max_weight: 0.4  # Maximum weight per asset (40% max per position)
  max_sector_exposure: 0.5  # Maximum exposure to single sector
  min_assets: 5  # Minimum number of assets to hold
  max_assets: null  # Maximum number of assets (null = no limit)

# Risk Parameters
risk:
  target_return: 0.12  # 12% annual target return
  max_volatility: 0.20  # 20% maximum volatility
  max_drawdown: 0.30  # 30% maximum drawdown tolerance
  confidence_level: 0.95  # For VaR/CVaR calculations

# Return Estimation
returns:
  estimation_method: "historical_mean"  # historical_mean, exponential, james_stein
  lookback_period: 252  # Trading days (1 year)
  min_history: 126  # Minimum 6 months of data
  exponential_span: 60  # For exponential weighting
  shrinkage: 0.1  # For shrinkage estimators

# Covariance Estimation
covariance:
  estimation_method: "sample"  # sample, ledoit_wolf, oas, shrunk
  lookback_period: 252
  min_history: 126
  shrinkage: 0.1
  ewma_span: 60  # For exponential weighting

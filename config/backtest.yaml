# Backtest settings read by run_backtest.py

period:
  start_date: "2018-01-01"
  end_date: "2024-12-31"

rebalancing:
  frequency: "monthly"  # daily, weekly, monthly or quarterly
  lookback_window: 252  # Trading days of history given to each optimizer

transaction_costs:
  total_cost_pct: 0.0015  # 15 bps charged on one-way turnover at each rebalance

capital:
  initial: 100000.0

performance:
  risk_free_rate: 0.04  # Used for Sharpe, Sortino and alpha in the results

outputs:
  results_dir: "results/data"
  figures_dir: "results/figures"
